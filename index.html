<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Free Fire Menu</title>
  <style>
    :root {
      --green: #00ff95;
      --green-dark: #0ea671;
      --green-soft: #b6ffe6;
      --red: #ff4d4d;
      --text: #f2fff8;
    }

    * { 
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: Arial, sans-serif;
      background: #0a0f19;
      color: var(--text);
    }

    body {
      background: linear-gradient(135deg, #0d1320, #070d15);
    }

    /* TELA DE LOGIN */
    .login-screen {
      position: fixed;
      inset: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      background: rgba(0, 0, 0, 0.96);
      z-index: 99999;
    }

    .login-screen.hidden {
      display: none !important;
    }

    .login-box {
      width: min(88vw, 420px);
      background: linear-gradient(180deg, rgba(14,18,30,1), rgba(17,25,45,1));
      border: 2px solid var(--green);
      border-radius: 16px;
      box-shadow: 0 0 25px rgba(0,255,149,0.25);
      padding: 26px 22px 20px;
      text-align: center;
    }

    .login-box h1 {
      margin: 0 0 6px;
      color: var(--green);
      font-size: 32px;
      letter-spacing: 1px;
      text-shadow: 0 0 12px rgba(0,255,149,0.5);
    }

    .login-box .sub {
      margin: 0 0 20px;
      color: var(--green-soft);
      font-size: 12px;
      letter-spacing: 1px;
    }

    .login-box input {
      width: 100%;
      padding: 12px 14px;
      border-radius: 10px;
      border: 1.5px solid var(--green);
      background: rgba(0,0,0,0.45);
      color: #e8fff1;
      outline: none;
      font-size: 15px;
    }

    .login-box input::placeholder {
      color: rgba(191,255,225,0.5);
    }

    .login-box button {
      width: 100%;
      margin-top: 14px;
      padding: 12px 14px;
      border: none;
      border-radius: 10px;
      background: linear-gradient(180deg, var(--green), var(--green-dark));
      color: #03150d;
      font-weight: 800;
      letter-spacing: 1px;
      cursor: pointer;
      box-shadow: 0 0 12px rgba(0,255,149,0.45);
      transition: transform 0.15s ease;
    }

    .login-box button:hover {
      transform: translateY(-1px);
    }

    .login-box button:active {
      transform: translateY(1px);
    }

    .login-box .error {
      min-height: 18px;
      margin-top: 10px;
      font-size: 12px;
      color: #ff7d7d;
      display: none;
    }

    .login-box .error.show {
      display: block;
    }

    /* TELA DO JOGO */
    .game-screen {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(180deg, rgba(11,19,29,.56), rgba(9,13,21,.82));
      overflow: hidden;
      z-index: 0;
      display: none;
    }

    .game-screen.active {
      display: block;
    }

    .game-screen::before {
      content: "FREE FIRE";
      position: fixed;
      left: 18px;
      top: 16px;
      color: var(--green);
      font-weight: 800;
      letter-spacing: 2px;
      font-size: 15px;
      text-shadow: 0 0 12px rgba(0,255,149,0.8);
      z-index: 2;
      pointer-events: none;
    }

    .hud {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 1;
    }

    .crosshair {
      position: fixed;
      left: 50%;
      top: 50%;
      width: 42px;
      height: 42px;
      transform: translate(-50%, -50%);
      border: 1px solid rgba(0,255,149,0.75);
      box-shadow: 0 0 18px rgba(0,255,149,0.45);
      border-radius: 50%;
      background: rgba(0,255,149,0.02);
    }

    .crosshair::before,
    .crosshair::after {
      content: "";
      position: fixed;
      background: rgba(0,255,149,0.9);
      box-shadow: 0 0 8px rgba(0,255,149,0.9);
    }

    .crosshair::before {
      width: 2px;
      height: 52px;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      margin-top: -26px;
    }

    .crosshair::after {
      width: 52px;
      height: 2px;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      margin-left: -26px;
    }

    .mini-panel {
      position: fixed;
      top: 20px;
      right: 20px;
      width: 185px;
      background: rgba(0,0,0,0.28);
      border: 1px solid rgba(0,255,149,0.45);
      border-radius: 8px;
      padding: 8px 10px;
      box-shadow: 0 0 10px rgba(0,255,149,0.2);
      font-size: 11px;
      color: var(--green-soft);
      z-index: 2;
      pointer-events: none;
    }

    .mini-panel .row {
      display: flex;
      justify-content: space-between;
      line-height: 1.7;
    }

    .mini-panel strong {
      color: #d8fff1;
    }

    /* MENU FLUTUANTE */
    .menu {
      position: fixed;
      left: 40px;
      top: 80px;
      width: 300px;
      background: linear-gradient(180deg, rgba(9,16,26,0.97), rgba(13,19,31,0.97));
      border: 2px solid var(--green);
      border-radius: 14px;
      box-shadow: 0 0 18px rgba(0,255,149,0.25), inset 0 0 20px rgba(0,255,149,0.06);
      z-index: 10000;
      user-select: none;
      display: flex;
      flex-direction: column;
      transition: all 0.2s ease;
      max-height: 84vh;
      pointer-events: all;
    }

    .menu.minimized {
      width: 50px;
      height: 50px;
      border-radius: 50%;
      overflow: hidden;
      box-shadow: 0 0 20px rgba(0,255,149,0.4);
    }

    .menu.minimized .menu-body {
      display: none;
    }

    .menu.minimized .menu-title {
      display: none;
    }

    .menu.minimized .drag-mark {
      display: none;
    }

    .menu.minimized .menu-header {
      padding: 0;
      min-height: 50px;
      justify-content: center;
      border-radius: 50%;
      background: radial-gradient(circle at center, #6cffc3 0%, var(--green) 45%, var(--green-dark) 100%);
    }

    .menu.minimized .close-btn {
      display: none;
    }

    .menu-header {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 10px 10px 30px;
      background: linear-gradient(90deg, var(--green), var(--green-dark));
      border-top-left-radius: 11px;
      border-top-right-radius: 11px;
      color: #06130d;
      font-weight: 800;
      letter-spacing: 1px;
      cursor: grab;
      min-height: 42px;
      user-select: none;
      touch-action: none;
    }

    .menu.minimized .menu-header {
      padding: 8px 8px;
      justify-content: center;
      min-height: 50px;
      border-radius: 12px;
    }

    .menu-header:active {
      cursor: grabbing;
    }

    .menu-title {
      font-size: 12px;
      text-transform: uppercase;
      white-space: nowrap;
      color: #04160f;
      flex: 1;
    }

    .close-btn {
      position: absolute;
      left: 8px;
      top: 50%;
      width: 18px;
      height: 18px;
      transform: translateY(-50%);
      background: var(--red);
      border: 1px solid rgba(255,255,255,0.4);
      border-radius: 50%;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      font-weight: 900;
      line-height: 1;
      cursor: pointer;
      user-select: none;
      box-shadow: 0 0 10px rgba(255, 77, 77, 0.3);
      padding: 0;
      z-index: 10001;
    }

    .close-btn::before {
      content: "✕";
    }

    .close-btn:hover {
      background: #ff6666;
      box-shadow: 0 0 15px rgba(255, 77, 77, 0.6);
    }

    .close-btn:active {
      transform: translateY(-50%) scale(0.9);
    }

    .drag-mark {
      font-size: 12px;
      color: rgba(5, 17, 12, 0.8);
      margin-left: 8px;
      letter-spacing: 1px;
      opacity: 0.9;
    }

    .menu-body {
      max-height: calc(84vh - 50px);
      overflow-y: auto;
      padding: 12px 10px;
      flex: 1;
    }

    .menu-body::-webkit-scrollbar {
      width: 8px;
    }

    .menu-body::-webkit-scrollbar-track {
      background: rgba(0,255,149,0.1);
    }

    .menu-body::-webkit-scrollbar-thumb {
      background: rgba(0,255,149,0.38);
      border-radius: 999px;
    }

    .section {
      margin-bottom: 12px;
      padding: 8px;
      background: rgba(255,255,255,0.02);
      border: 1px solid rgba(0,255,149,0.15);
      border-radius: 10px;
    }

    .section-title {
      color: var(--green-soft);
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 1px;
      text-transform: uppercase;
      margin-bottom: 8px;
      opacity: 0.9;
    }

    .toggle {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 7px 8px;
      border-radius: 8px;
      border: 1px solid rgba(0,255,149,0.2);
      background: rgba(0,255,149,0.04);
      margin-bottom: 6px;
      font-size: 12px;
      color: #dfffe9;
    }

    .switch {
      position: relative;
      width: 42px;
      height: 22px;
      display: inline-block;
    }

    .switch input {
      opacity: 0;
      width: 0;
      height: 0;
    }

    .slider {
      position: absolute;
      inset: 0;
      border-radius: 999px;
      background: var(--red);
      transition: 0.2s ease;
      box-shadow: inset 0 0 4px rgba(0,0,0,0.35);
    }

    .slider::before {
      content: "";
      position: absolute;
      width: 16px;
      height: 16px;
      left: 4px;
      top: 3px;
      border-radius: 50%;
      background: #fff;
      transition: 0.2s ease;
      box-shadow: 0 0 8px rgba(0,0,0,0.3);
    }

    .switch input:checked + .slider {
      background: var(--green);
    }

    .switch input:checked + .slider::before {
      transform: translateX(19px);
    }

    .range-wrap {
      margin-top: 8px;
      color: #dfffe9;
      font-size: 11px;
    }

    .range-head {
      display: flex;
      justify-content: space-between;
      margin-bottom: 5px;
    }

    input[type="range"] {
      width: 100%;
      accent-color: var(--green);
      cursor: pointer;
    }

    .mini-action {
      display: block;
      width: 100%;
      margin-top: 8px;
      padding: 9px 10px;
      border-radius: 8px;
      background: rgba(0,255,149,0.1);
      color: var(--green-soft);
      border: 1px solid rgba(0,255,149,0.6);
      font-weight: 700;
      font-size: 11px;
      cursor: pointer;
      transition: transform 0.12s ease;
    }

    .mini-action:hover {
      transform: translateY(-1px);
    }

    .mini-action:active {
      transform: translateY(0px);
    }

    .mini-action.primary {
      background: linear-gradient(180deg, var(--green), var(--green-dark));
      border-color: rgba(0,255,149,0.9);
      color: #03150d;
      box-shadow: 0 0 14px rgba(0,255,149,0.25);
      font-weight: 800;
    }

    .background-sign {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      color: rgba(182, 255, 230, 0.12);
      font-size: clamp(24px, 5vw, 72px);
      font-weight: 800;
      letter-spacing: 0.18em;
      text-transform: none;
      pointer-events: none;
      user-select: none;
      z-index: 0;
      text-shadow: 0 0 18px rgba(0,255,149,0.12);
      transform: rotate(-12deg);
    }

    .toast {
      position: fixed;
      right: 18px;
      top: 18px;
      background: rgba(0,0,0,0.78);
      border: 1px solid rgba(0,255,149,0.7);
      color: var(--green-soft);
      border-radius: 8px;
      padding: 10px 12px;
      font-size: 12px;
      z-index: 12000;
      box-shadow: 0 0 12px rgba(0,255,149,0.2);
      animation: fade 2.4s ease forwards;
      pointer-events: none;
    }

    @keyframes fade {
      0% { opacity: 0; transform: translateY(-8px); }
      15% { opacity: 1; transform: translateY(0); }
      85% { opacity: 1; }
      100% { opacity: 0; transform: translateY(-8px); }
    }
  </style>
</head>
<body>
  <!-- JOGO -->
  <div id="gameScreen" class="game-screen">
    <div class="hud">
      <div class="crosshair"></div>
      <div class="mini-panel">
        <div class="row"><span>FPS</span><strong>240</strong></div>
        <div class="row"><span>Ping</span><strong>16ms</strong></div>
        <div class="row"><span>Alvo</span><strong>4</strong></div>
      </div>
    </div>

    <!-- MENU -->
    <div id="menu" class="menu">
      <div class="menu-header" id="menuHeader">
        <div class="close-btn" id="closeBtn"></div>
        <div class="menu-title">Menu</div>
        <div class="drag-mark">⋮⋮</div>
      </div>

      <div class="menu-body">
        <div class="section">
          <div class="section-title">Aimbot</div>

          <div class="toggle">
            <span>Principal</span>
            <label class="switch">
              <input type="checkbox" checked />
              <span class="slider"></span>
            </label>
          </div>

          <div class="toggle">
            <span>FOV</span>
            <label class="switch">
              <input type="checkbox" />
              <span class="slider"></span>
            </label>
          </div>

          <div class="toggle">
            <span>Silent</span>
            <label class="switch">
              <input type="checkbox" />
              <span class="slider"></span>
            </label>
          </div>

          <div class="range-wrap">
            <div class="range-head">
              <span>Velocidade</span>
              <strong id="speedValue">75%</strong>
            </div>
            <input type="range" min="1" max="100" value="75" id="speedRange" />
          </div>

          <div class="range-wrap">
            <div class="range-head">
              <span>FOV</span>
              <strong id="fovValue">300</strong>
            </div>
            <input type="range" min="50" max="500" value="300" id="fovRange" />
          </div>
        </div>

        <div class="section">
          <div class="section-title">Visual</div>

          <div class="toggle">
            <span>ESP</span>
            <label class="switch">
              <input type="checkbox" />
              <span class="slider"></span>
            </label>
          </div>

          <div class="toggle">
            <span>Skeleton</span>
            <label class="switch">
              <input type="checkbox" />
              <span class="slider"></span>
            </label>
          </div>

          <div class="toggle">
            <span>Wallhack</span>
            <label class="switch">
              <input type="checkbox" />
              <span class="slider"></span>
            </label>
          </div>
        </div>

        <div class="section">
          <div class="section-title">Extras</div>

          <div class="toggle">
            <span>RCS</span>
            <label class="switch">
              <input type="checkbox" />
              <span class="slider"></span>
            </label>
          </div>

          <div class="toggle">
            <span>Speed</span>
            <label class="switch">
              <input type="checkbox" />
              <span class="slider"></span>
            </label>
          </div>

          <button class="mini-action" id="resetBtn">RESETAR</button>
          <button class="mini-action primary" id="enterGameBtn">ENTRAR NO FREE FIRE</button>
        </div>
      </div>
    </div>
  </div>

  <div class="background-sign">@DONOXITER-ERICK</div>

  <script>
    (function initMenu() {
      const gameScreen = document.getElementById("gameScreen");
      const menu = document.getElementById("menu");
      const closeBtn = document.getElementById("closeBtn");
      const menuHeader = document.getElementById("menuHeader");
      const speedRange = document.getElementById("speedRange");
      const fovRange = document.getElementById("fovRange");
      const speedValue = document.getElementById("speedValue");
      const fovValue = document.getElementById("fovValue");

      let isDragging = false;
      let dragOffsetX = 0;
      let dragOffsetY = 0;

      function showToast(msg) {
        const existing = document.querySelector(".toast");
        if (existing) existing.remove();
        const toast = document.createElement("div");
        toast.className = "toast";
        toast.textContent = msg;
        document.body.appendChild(toast);
      }

      function setMenuState(minimized) {
        menu.classList.toggle("minimized", minimized);
      }

      function startDragging(event) {
        const clickedClose = event.target && event.target.closest && event.target.closest("#closeBtn");
        if (clickedClose) return;

        event.preventDefault();
        isDragging = true;
        menu.style.transition = "none";

        const rect = menu.getBoundingClientRect();
        dragOffsetX = event.clientX - rect.left;
        dragOffsetY = event.clientY - rect.top;
      }

      function dragMenu(event) {
        if (!isDragging) return;

        let x = event.clientX - dragOffsetX;
        let y = event.clientY - dragOffsetY;

        const maxX = window.innerWidth - menu.offsetWidth - 10;
        const maxY = window.innerHeight - menu.offsetHeight - 10;

        x = Math.max(10, Math.min(x, maxX));
        y = Math.max(10, Math.min(y, maxY));

        menu.style.left = x + "px";
        menu.style.top = y + "px";
      }

      function stopDragging() {
        isDragging = false;
        menu.style.transition = "";
      }

      closeBtn.addEventListener("click", (event) => {
        event.stopPropagation();
        setMenuState(!menu.classList.contains("minimized"));
      });

      document.addEventListener("keydown", (event) => {
        const isMenuOpen = !menu.classList.contains("minimized");
        if ((event.ctrlKey && event.key.toLowerCase() === "m") || (event.key === "Escape" && isMenuOpen)) {
          event.preventDefault();
          setMenuState(true);
          return;
        }
        if (event.key === "Escape" && !isMenuOpen) {
          event.preventDefault();
          setMenuState(false);
        }
      });

      menuHeader.addEventListener("mousedown", startDragging);
      document.addEventListener("mousemove", dragMenu);
      document.addEventListener("mouseup", stopDragging);

      speedRange.addEventListener("input", () => {
        speedValue.textContent = speedRange.value + "%";
      });

      fovRange.addEventListener("input", () => {
        fovValue.textContent = fovRange.value;
      });

      document.getElementById("resetBtn").addEventListener("click", () => {
        const toggles = document.querySelectorAll('input[type="checkbox"]');
        toggles.forEach((el) => el.checked = false);
        speedRange.value = 75;
        fovRange.value = 300;
        speedValue.textContent = "75%";
        fovValue.textContent = "300";
        showToast("✓ Resetado");
      });

      document.getElementById("enterGameBtn").addEventListener("click", () => {
        if (!/Android/i.test(navigator.userAgent)) {
          showToast("Abra esta página no Android para iniciar o jogo");
          return;
        }

        window.location.href = "intent://#Intent;package=com.dts.freefireth;action=android.intent.action.MAIN;category=android.intent.category.LAUNCHER;end";
      });

      menu.style.left = "40px";
      menu.style.top = "80px";
      menuHeader.setAttribute("data-drag-ready", "true");
      gameScreen.style.display = "block";
      gameScreen.classList.add("active");
      setMenuState(false);
    })();
  </script>
</body>
</html>
